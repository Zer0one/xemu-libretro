# Prepare source texts & upload them to Crowdin

name: Crowdin Source Texts Upload

# Disabled in this fork's GitHub Actions settings; do not re-enable or dispatch
# without explicit approval. When enabled, upload English texts from main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ui/libretro_core_options.h'

jobs:
  upload_source_file:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 18
          distribution: zulu

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Checkout
        uses: actions/checkout@v3

      - name: Upload Source
        shell: bash
        env:
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_API_KEY }}
        run: |
          python3 intl/upload_workflow.py $CROWDIN_API_KEY "xemu-libretro" "ui/libretro_core_options.h"
